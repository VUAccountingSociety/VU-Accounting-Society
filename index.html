<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VU Accounting Society</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1a1a1a;background:#f8f8f6}
  :root{--navy:#0a1f44;--gold:#c9a84c;--gold-light:#f0d080;--navy-light:#1a3a6e}
  .site-wrap{max-width:880px;margin:0 auto;padding:0 0 3rem}
  nav{background:var(--navy);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100}
  .nav-brand{color:var(--gold);font-size:15px;font-weight:600;letter-spacing:.02em;text-decoration:none}
  .nav-links{display:flex;gap:1.25rem;flex-wrap:wrap}
  .nav-links a{color:rgba(255,255,255,.75);font-size:13px;text-decoration:none;transition:color .15s}
  .nav-links a:hover{color:var(--gold-light)}
  .hero{background:var(--navy);padding:3.5rem 2rem 3rem;text-align:center;margin-bottom:2.5rem}
  .hero-badge{display:inline-block;background:var(--gold);color:var(--navy);font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;letter-spacing:.05em;margin-bottom:1rem;text-transform:uppercase}
  .hero h1{color:#fff;font-size:30px;font-weight:600;line-height:1.25;margin-bottom:.75rem}
  .hero p{color:rgba(255,255,255,.7);font-size:15px;max-width:480px;margin:0 auto 1.75rem;line-height:1.65}
  .hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn-primary{background:var(--gold);color:var(--navy);border:none;padding:10px 22px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
  .btn-outline{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);padding:10px 22px;border-radius:8px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn-primary:hover{background:var(--gold-light)}
  .btn-outline:hover{border-color:rgba(255,255,255,.6)}
  section{padding:0 2rem;margin-bottom:2.75rem}
  .section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin-bottom:.4rem}
  .section-title{font-size:22px;font-weight:600;margin-bottom:.75rem;color:#0a1f44}
  .divider{width:40px;height:2px;background:var(--gold);margin-bottom:1.5rem}
  .about-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .about-card{background:#fff;border:1px solid #e8e6de;border-radius:12px;padding:1.1rem 1.25rem}
  .about-card .icon{font-size:20px;color:var(--gold);margin-bottom:.5rem}
  .about-card h3{font-size:14px;font-weight:600;margin-bottom:.35rem;color:#0a1f44}
  .about-card p{font-size:13px;color:#666;line-height:1.55}
  .membership-banner{background:var(--navy);border-radius:12px;padding:1.5rem 1.75rem;margin-bottom:1.5rem;display:flex;align-items:flex-start;gap:1.25rem}
  .membership-banner .icon{font-size:28px;color:var(--gold);flex-shrink:0;margin-top:2px}
  .membership-banner h3{font-size:16px;font-weight:600;color:#fff;margin-bottom:.35rem}
  .membership-banner p{font-size:13px;color:rgba(255,255,255,.7);line-height:1.6}
  .membership-banner strong{color:var(--gold-light)}
  .events-list{display:flex;flex-direction:column;gap:10px}
  .event-row{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid #e8e6de;border-radius:12px;padding:1rem 1.25rem}
  .event-row.featured{border:2px solid var(--gold);background:#fffdf5}
  .event-date{background:var(--navy);color:#fff;border-radius:8px;padding:6px 10px;text-align:center;min-width:52px;flex-shrink:0}
  .event-date .month{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold-light)}
  .event-date .day{font-size:18px;font-weight:600;line-height:1}
  .event-info h3{font-size:14px;font-weight:600;margin-bottom:2px;color:#0a1f44}
  .event-info p{font-size:12px;color:#888;line-height:1.5}
  .event-tag{margin-left:auto;font-size:11px;padding:3px 10px;border-radius:20px;white-space:nowrap;font-weight:500;flex-shrink:0}
  .tag-mtf{background:rgba(201,168,76,.2);color:#7a5e10}
  .tag-workshop{background:#eef5ff;color:#1a4fa8}
  .tag-kickoff{background:#edfaf3;color:#166a3a}
  .officers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:16px}
  .officer-card{border-radius:12px;overflow:hidden;position:relative;background:#fff;border:1px solid #e8e6de}
  .officer-photo{width:100%;aspect-ratio:1/1;background:#e8e5dc;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .officer-photo img{width:100%;height:100%;object-fit:cover;display:block}
  .officer-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;height:100%;background:linear-gradient(135deg,#1a3a6e 0%,#0a1f44 100%)}
  .officer-initials{font-size:28px;font-weight:700;color:var(--gold);letter-spacing:.02em}
  .officer-photo-label{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.06em;text-transform:uppercase}
  .officer-overlay{position:absolute;inset:0;background:rgba(10,31,68,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;transition:opacity .2s ease}
  .officer-card:hover .officer-overlay{opacity:1}
  .overlay-btn{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);border:1px solid rgba(201,168,76,.4);color:#fff;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:500;text-decoration:none;transition:background .15s;cursor:pointer}
  .overlay-btn:hover{background:rgba(201,168,76,.2)}
  .overlay-btn i{font-size:15px;color:var(--gold)}
  .officer-info{padding:.75rem 1rem}
  .officer-info h3{font-size:14px;font-weight:600;color:#0a1f44;margin-bottom:2px}
  .officer-info p{font-size:12px;color:#888}
  .officer-card.vacant .officer-placeholder{background:linear-gradient(135deg,#ddd 0%,#ccc 100%)}
  .resources-intro{font-size:14px;color:#555;margin-bottom:1.25rem;line-height:1.6}
  .year-block{margin-bottom:1.75rem}
  .year-label{display:flex;align-items:center;gap:10px;margin-bottom:.75rem}
  .year-badge{background:var(--navy);color:var(--gold);font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase}
  .year-note{font-size:12px;color:#888;font-style:italic}
  .program-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
  .program-card{background:#fff;border:1px solid #e8e6de;border-radius:12px;padding:1rem 1.1rem;text-decoration:none;color:#1a1a1a;transition:border-color .15s;display:block}
  .program-card:hover{border-color:var(--gold)}
  .program-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem}
  .program-firm{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--gold)}
  .program-type{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500}
  .program-type.internship{background:#edfaf3;color:#166a3a}
  .program-type.slp{background:#eef5ff;color:#1a4fa8}
  .program-name{font-size:14px;font-weight:600;color:#0a1f44;margin-bottom:.25rem}
  .program-desc{font-size:12px;color:#666;line-height:1.5;margin-bottom:.5rem}
  .program-meta{display:flex;gap:10px;flex-wrap:wrap}
